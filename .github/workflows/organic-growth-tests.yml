name: Organic growth engine tests

on:
  push:
    branches:
      - feature/organic-audience-growth
  pull_request:
    branches:
      - main

jobs:
  organic-growth-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run organic growth unit tests
        run: npm test
