name: Process scheduled social posts

on:
  # Pakistan daytime (08:08–19:05 PKT), every 15 minutes, offset from the
  # busiest top-of-hour queue window used by GitHub scheduled workflows.
  # GitHub schedule times are UTC; Pakistan is UTC+5.
  schedule:
    # Minute offset change also reactivates a schedule that GitHub has stopped.
    - cron: "8,23,38,53 3-13 * * *"
    - cron: "5 14 * * *"
  # Kick the worker when posting code or schedule policy changes are deployed.
  push:
    branches:
      - main
    paths:
      - .github/workflows/process-schedules.yml
      - backend/services/publishService.js
      - backend/services/automaticScheduleService.js
      - backend/server.js
      - backend/vercel.json
  workflow_dispatch:

permissions: {}

# Do not let two cron/manual invocations race the same social accounts or
# publish multiple overdue Reels at once.
concurrency:
  group: cart2door-social-publisher
  cancel-in-progress: false

jobs:
  process-due-schedules:
    runs-on: ubuntu-26.04
    # Wait for Vercel's production alias to serve this commit before asking it
    # to process schedules. GitHub's push event can arrive before deployment.
    timeout-minutes: 20
    steps:
      - name: Wait for this commit to reach the production API
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 90); do
            deployed_commit="$(curl --fail --silent --max-time 10 \
              https://trend-gadgets-api.vercel.app/api/health | jq -r '.deploymentCommit // empty')" || deployed_commit=""
            if [ "$deployed_commit" = "$EXPECTED_COMMIT" ]; then
              echo "Production API is serving $EXPECTED_COMMIT"
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/90); API serves ${deployed_commit:-unknown}"
            sleep 10
          done
          echo "Production API did not deploy $EXPECTED_COMMIT; refusing to run the posting worker against old code."
          exit 1
      - name: Call the protected schedule worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 270 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://trend-gadgets-api.vercel.app/api/cron/process-schedules
