name: Process scheduled social posts

on:
  # Pakistan daytime (08:02–19:47 PKT), every 15 minutes, offset from the
  # busiest top-of-hour queue window used by GitHub scheduled workflows.
  # GitHub schedule times are UTC; Pakistan is UTC+5.
  schedule:
    # Minute offset change also reactivates a schedule that GitHub has stopped.
    - cron: "5,20,35,50 3-14 * * *"
  # Kick the worker when posting code or schedule policy changes are deployed.
  push:
    branches:
      - main
    paths:
      - .github/workflows/process-schedules.yml
      - backend/services/publishService.js
      - backend/services/automaticScheduleService.js
      - backend/server.js
      - backend/vercel.json
  workflow_dispatch:

permissions: {}

# Do not let two cron/manual invocations race the same social accounts or
# publish multiple overdue Reels at once.
concurrency:
  group: cart2door-social-publisher
  cancel-in-progress: false

jobs:
  process-due-schedules:
    runs-on: ubuntu-latest
    # The Vercel function may need time to wait for Instagram to finish
    # processing a Reel before it can publish and save the result.
    timeout-minutes: 5
    steps:
      - name: Call the protected schedule worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 270 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://trend-gadgets-api.vercel.app/api/cron/process-schedules
